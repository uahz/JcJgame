<style>
/* ==========================================================================
   风起旧厂街 · 写实电影感（Cinematic Realism）
   暗夜基底 + 暖琥珀实用光 + 冷青阴影 + 玻璃拟态 + 胶片颗粒
   ========================================================================== */

:root{
  /* 明暗层级 */
  --bg0:#07090b; --bg1:#0b0f12; --bg2:#11171b; --bg3:#182025;
  /* 玻璃 */
  --glass:rgba(14,19,23,.74);
  --glass-2:rgba(20,26,31,.62);
  --glass-line:rgba(255,255,255,.09);
  --glass-hi:rgba(255,255,255,.16);
  /* 暖琥珀（主色） */
  --amber:#e0a04a; --amber-2:#ffc878; --amber-3:#a9702a;
  --amber-glow:rgba(224,160,74,.22);
  /* 冷青（辅色） */
  --teal:#3d7681; --teal-2:#74b4bb;
  /* 文字 */
  --ink:#ece5d8; --ink2:#a8b0b4; --ink3:#6d777d;
  /* 语义色 */
  --danger:#d9634f; --ok:#63a37c; --gold:#d8ab55;
  --line:rgba(255,255,255,.08);
  --shadow:0 18px 48px rgba(0,0,0,.62);
  --shadow-s:0 4px 16px rgba(0,0,0,.45);
  /* 字体 */
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
  --ui:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --blur:18px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 0%,#151c21 0%,var(--bg1) 45%,var(--bg0) 100%);
  color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--ui);cursor:pointer;color:inherit;background:none;border:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* 表情符号统一压成暖金色调，避免彩色破坏写实氛围 */
.chip .e,#whoAv,.affRow .av,#title .fish{filter:grayscale(.8) sepia(.55) saturate(2.1) hue-rotate(-12deg) brightness(1.06)}
#sndBtn .e{filter:grayscale(.8) sepia(.55) saturate(2.1) hue-rotate(-12deg) brightness(1.06)}

/* ==========================================================================
   舞台：写实照片 + 电影调色 + 颗粒 + 暗角
   ========================================================================== */
#stage{position:absolute;inset:0;transition:opacity .7s ease-out;overflow:hidden}
#bg{position:absolute;inset:0;transition:background 1.2s ease-in-out}
/* 照片未加载完成或加载失败时的兜底暗色（同一色系） */
.bg-market{background:radial-gradient(ellipse at 40% 20%,#2a2419 0%,#0d1114 70%)}
.bg-station{background:radial-gradient(ellipse at 50% 10%,#1d2a2c 0%,#0b0f12 70%)}
.bg-jinhan{background:radial-gradient(ellipse at 55% 15%,#2e2118 0%,#0d0f13 70%)}
.bg-tower{background:radial-gradient(ellipse at 50% 30%,#152232 0%,#080b0e 70%)}
.bg-rain{background:radial-gradient(ellipse at 50% 25%,#1b2426 0%,#080b0d 70%)}
.bg-cell{background:radial-gradient(ellipse at 50% 0%,#1b2226 0%,#090c0e 70%)}
.bg-dawn{background:radial-gradient(ellipse at 50% 60%,#3a2d1c 0%,#101418 70%)}

#deco{display:none}

/* 写实场景照片层 */
#sceneArt{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sceneEnv{
  position:absolute;inset:0;background-size:cover;background-position:center;
  background-repeat:no-repeat;opacity:0;
  transition:opacity .9s ease-out,background-image .9s ease-out;
  transform:scale(1.04);animation:kenburns 34s ease-in-out infinite alternate;
}
@keyframes kenburns{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.11) translate3d(-1.2%,-1.2%,0)}}

/* 电影调色：上方压暗出标题空间 + 下方压暗托住对白 + 整体冷暖分离 + 暗角 */
#scenePhotoTint{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(6,9,12,.80) 0%,rgba(6,9,12,.30) 26%,rgba(6,9,12,.10) 44%,rgba(5,8,10,.58) 74%,rgba(4,6,8,.90) 100%),
    radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 34%,rgba(0,0,0,.62) 100%),
    linear-gradient(115deg,rgba(58,124,140,.14) 0%,rgba(0,0,0,0) 42%,rgba(150,92,30,.14) 100%);
}

/* 胶片颗粒（用 transform 动画，走合成层不触发重绘） */
#fog{
  position:absolute;inset:-28%;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.42'/></svg>");
  animation:grainshift .9s steps(3) infinite;
  will-change:transform;
}
@keyframes grainshift{0%{transform:translate3d(0,0,0)}33%{transform:translate3d(-2%,1.5%,0)}66%{transform:translate3d(1.5%,-2%,0)}100%{transform:translate3d(0,0,0)}}

/* 人物前景剪影：大比例压在画面下缘、重度虚化，只留「有人在场」的空间纵深，
   不暴露卡通造型（Q 版立绘的头部轮廓被虚化彻底糊掉） */
#sceneArt .fig{position:absolute;bottom:-20%;transition:opacity .7s ease-out;pointer-events:none}
#sceneArt .fig svg{
  display:block;width:100%;opacity:.5;
  filter:brightness(0) blur(20px);
}
#figL{left:-16%;width:36%}
#figR{right:-16%;width:33%}
#chibi{display:none}

/* 雨幕（bg-rain 时叠加） */
#stage.rainOn #sceneArt::after{
  content:"";position:absolute;inset:-45% -12%;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(76deg,rgba(198,216,238,.10) 0 1.2px,transparent 1.2px 9px);
  animation:rainmove .55s linear infinite;
}
@keyframes rainmove{from{transform:translateY(0)}to{transform:translateY(24px)}}

/* ==========================================================================
   顶部状态栏
   ========================================================================== */
#hud{
  position:relative;z-index:5;display:none;flex-wrap:wrap;gap:7px;align-items:center;
  padding:calc(11px + var(--sat,0px)) 18px 11px;
  background:linear-gradient(180deg,rgba(8,11,14,.88) 0%,rgba(8,11,14,.52) 100%);
  backdrop-filter:blur(var(--blur)) saturate(130%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(130%);
  border-bottom:1px solid var(--glass-line);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
#chTag{
  font-family:var(--serif);color:var(--amber-2);font-size:14px;font-weight:600;
  letter-spacing:3px;margin-right:6px;white-space:nowrap;
  text-shadow:0 0 18px rgba(224,160,74,.45);
}
.chip{
  display:flex;align-items:center;gap:5px;font-size:13px;padding:4px 12px;
  border:1px solid var(--glass-line);border-radius:999px;
  background:var(--glass-2);color:var(--ink2);position:relative;white-space:nowrap;
    transition:border-color .3s,background .3s,transform .3s;
}
.chip b{font-weight:600;color:var(--amber-2);font-variant-numeric:tabular-nums}
.chip.warn{
  border-color:rgba(217,99,79,.62);background:rgba(90,32,26,.55);color:#f0b6ab;
  animation:softpulse 2.2s ease-in-out infinite;
}
.chip.warn b{color:#ff9d88}
@keyframes softpulse{50%{box-shadow:0 0 0 5px rgba(217,99,79,.14)}}
.chip.btn{cursor:pointer}
.chip.btn:hover{transform:scale(1.05);border-color:rgba(224,160,74,.55);background:rgba(224,160,74,.12)}
#sndBtn{
  margin-left:auto;background:var(--glass-2);border:1px solid var(--glass-line);
  color:var(--ink2);border-radius:999px;padding:4px 13px;font-size:12.5px;
    transition:all .3s;
}
#sndBtn:hover{color:var(--amber-2);border-color:rgba(224,160,74,.5);transform:scale(1.05)}
.flo{position:absolute;right:8px;top:-6px;font-size:12px;font-weight:700;pointer-events:none;animation:flo 1.1s forwards}
.flo.up{color:#7fd4a2}.flo.dn{color:#ff8f7a}
@keyframes flo{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-18px)}}

/* ==========================================================================
   对话区
   ========================================================================== */
#bottom{position:relative;z-index:5;margin-top:auto;padding:14px 18px calc(22px + var(--sab,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
#dlg{
  width:min(940px,100%);
  background:linear-gradient(180deg,rgba(20,26,31,.80) 0%,rgba(11,15,18,.86) 100%);
  border:1px solid var(--glass-line);border-top-color:var(--glass-hi);
  border-radius:16px;padding:20px 24px 17px;min-height:136px;position:relative;
  box-shadow:var(--shadow);
  backdrop-filter:blur(var(--blur)) saturate(135%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(135%);
}
#who{
  position:absolute;top:-14px;left:20px;display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(180deg,rgba(38,30,19,.96),rgba(22,18,12,.96));
  border:1px solid rgba(224,160,74,.42);border-radius:999px;
  padding:3px 14px 3px 6px;font-size:13px;font-weight:600;letter-spacing:1.5px;
  color:var(--amber-2);box-shadow:0 4px 18px rgba(0,0,0,.5),0 0 22px rgba(224,160,74,.14);
}
#who .av{
  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;
  background:rgba(224,160,74,.16);border:1px solid rgba(224,160,74,.35);
}
#txt{
  font-family:var(--serif);font-size:19px;line-height:1.95;letter-spacing:.5px;
  min-height:72px;color:var(--ink);white-space:pre-wrap;
  text-shadow:0 1px 12px rgba(0,0,0,.55);
}
#hint{position:absolute;right:18px;bottom:11px;font-size:12px;color:var(--amber);opacity:.75;letter-spacing:1px;animation:blink 1.7s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}

/* ==========================================================================
   选项
   ========================================================================== */
#choices{width:min(940px,100%);display:flex;flex-direction:column;gap:9px}
.choice{
  position:relative;text-align:left;
  background:linear-gradient(180deg,rgba(20,26,31,.76) 0%,rgba(12,16,19,.80) 100%);
  border:1px solid var(--glass-line);border-radius:14px;color:var(--ink);
  font-size:15.5px;font-weight:500;padding:13px 17px 13px 46px;line-height:1.55;
  box-shadow:var(--shadow-s);transition:all .32s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
}
/* 左侧琥珀指示条 + 序号 */
.choice::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--amber-2),var(--amber-3));
  transform:scaleY(0);transform-origin:center;transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.choice::after{
  content:"";position:absolute;left:20px;top:50%;width:6px;height:6px;
  margin-top:-3px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 10px rgba(224,160,74,.55);transition:all .32s;
}
.choice:hover{
  transform:translateX(3px);
  border-color:rgba(224,160,74,.48);
  background:linear-gradient(180deg,rgba(38,32,22,.82) 0%,rgba(20,18,14,.84) 100%);
  box-shadow:var(--shadow),0 0 28px rgba(224,160,74,.12);
}
.choice:hover::before{transform:scaleY(1)}
.choice:active{transform:translateX(3px) scale(.985)}
.choice .fx{display:block;font-size:12px;color:var(--ink3);margin-top:4px;font-family:var(--ui);letter-spacing:.3px}
.choice.lock{opacity:.42;cursor:not-allowed}
.choice.lock:hover{transform:none;box-shadow:var(--shadow-s);border-color:var(--glass-line);background:linear-gradient(180deg,rgba(20,26,31,.76),rgba(12,16,19,.80))}
.choice.lock::after{background:var(--ink3);box-shadow:none}
.choice.cardOpt{border-color:rgba(224,160,74,.42);background:linear-gradient(180deg,rgba(44,34,18,.78) 0%,rgba(24,19,12,.82) 100%)}
.choice.cardOpt::after{background:var(--amber-2);box-shadow:0 0 12px rgba(255,200,120,.7)}
.choice.chosen{border-color:rgba(224,160,74,.9);background:rgba(224,160,74,.2)}

/* 长按拖拽选择（Apple 式） */
body.dragging{overflow:hidden;cursor:grabbing}
body.dragging #choices{touch-action:none}
body.dragging #choices{filter:saturate(.55) brightness(.82)}
body.dragging #choices .choice{transition:transform .12s ease-out,background .12s,border-color .12s,box-shadow .12s}
.choice.dragOver{
  background:linear-gradient(180deg,rgba(72,56,26,.92),rgba(40,31,16,.94))!important;
  border-color:var(--amber-2)!important;
  transform:translateX(5px) scale(1.02);
  box-shadow:0 0 34px rgba(224,160,74,.34),var(--shadow)!important;
}
.choice.dragOver::before{transform:scaleY(1)}
.choice.dragOver::after{background:#fff;box-shadow:0 0 14px rgba(255,255,255,.85)}
.choice.dragging{transform:scale(.975);opacity:.72}
.dragHint{
  margin:0 auto 8px;text-align:center;font-size:12px;color:var(--amber-2);
  letter-spacing:2px;padding:6px 18px;border-radius:999px;
  background:rgba(8,11,14,.80);border:1px solid rgba(224,160,74,.34);
  box-shadow:0 6px 22px rgba(0,0,0,.55);white-space:nowrap;
  transition:opacity .5s;
}
.dragHint.fade{opacity:0}

/* ==========================================================================
   覆盖层
   ========================================================================== */
.ovl{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;padding:26px;overflow:auto;
  background:rgba(5,7,9,.80);
  backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%);
}
.ovl.show{display:flex}

/* 时代过场 */
#era .y{font-size:13px;letter-spacing:9px;color:var(--amber);margin-bottom:18px;text-shadow:0 0 18px rgba(224,160,74,.4)}
#era .t{font-family:var(--serif);font-size:clamp(38px,8vw,58px);font-weight:600;letter-spacing:12px;color:var(--ink);text-shadow:0 4px 30px rgba(0,0,0,.8)}
#era .s{margin-top:22px;color:var(--ink2);font-family:var(--serif);font-size:16.5px;line-height:2.1;max-width:540px}
#era .go,.mbtn{
  margin-top:44px;background:linear-gradient(180deg,rgba(224,160,74,.94),rgba(170,112,40,.94));
  color:#1a1206;border:1px solid rgba(255,200,120,.5);border-radius:14px;
  padding:12px 36px;font-size:14px;font-weight:700;letter-spacing:4px;
  box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 26px rgba(224,160,74,.22);transition:all .4s cubic-bezier(.4,0,.2,1);
}
#era .go:hover,.mbtn:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(0,0,0,.55),0 0 34px rgba(224,160,74,.34)}
#era .go:active,.mbtn:active{transform:translateY(0) scale(.98)}

/* 标题页：真实窗景主视觉 */
#title{
  background:var(--bg0);overflow:hidden;justify-content:center;
}
#titleArt{
  position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.4s ease-out;
  transform:scale(1.06);animation:kenburns 40s ease-in-out infinite alternate;
}
#title::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    linear-gradient(180deg,rgba(5,7,9,.72) 0%,rgba(5,7,9,.22) 28%,rgba(4,6,8,.40) 58%,rgba(3,5,7,.90) 100%),
    radial-gradient(ellipse at 50% 44%,rgba(0,0,0,0) 30%,rgba(0,0,0,.52) 100%),
    linear-gradient(100deg,rgba(150,92,30,.14),rgba(0,0,0,0) 45%,rgba(58,124,140,.12));
}
/* 注意：只给文字层提 z-index，绝不能写成 #title>* —— 那会把 #titleArt 的
   position:absolute 覆盖成 relative（同优先级后定义者胜），主视觉会直接塌成 0 高 */
#title .fish,#title h1,#title .sub,#title .desc,#title .btns{position:relative;z-index:2}
#title .fish{
  font-size:0;width:2px;height:2px;overflow:hidden;
  filter:grayscale(1) sepia(.6) saturate(2) brightness(1.1);
}
#title h1{
  font-family:var(--serif);font-size:clamp(42px,9vw,84px);font-weight:600;
  letter-spacing:16px;text-indent:16px;color:#f4efe4;
  text-shadow:0 6px 40px rgba(0,0,0,.9),0 0 60px rgba(224,160,74,.22);
}
#title .sub{
  margin-top:16px;color:var(--amber-2);letter-spacing:7px;font-size:14px;font-weight:600;
  text-shadow:0 2px 18px rgba(0,0,0,.85);
}
#title .desc{
  margin-top:20px;color:var(--ink2);font-size:13.5px;line-height:2.2;max-width:540px;
  font-family:var(--serif);text-shadow:0 2px 16px rgba(0,0,0,.9);
}
#title .btns{margin-top:42px;display:flex;flex-direction:column;gap:12px;width:min(330px,84vw)}
/* 标题页按钮次级态 */
#title .mbtn{background:rgba(14,19,23,.66);border:1px solid var(--glass-line);color:var(--ink);border-radius:14px;
  padding:14px 20px;font-size:15.5px;font-weight:600;letter-spacing:4px;margin-top:0;
    box-shadow:0 8px 26px rgba(0,0,0,.5);transition:all .4s cubic-bezier(.4,0,.2,1)}
#title .mbtn:hover{transform:translateY(-2px);border-color:rgba(224,160,74,.5);background:rgba(30,26,18,.72)}
#title .mbtn.pri{
  background:linear-gradient(180deg,rgba(224,160,74,.95),rgba(170,112,40,.95));
  color:#1a1206;border-color:rgba(255,200,120,.55);
  box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 30px rgba(224,160,74,.26);
}

/* 结局 */
#endCard{
  position:relative;width:min(780px,100%);
  background:linear-gradient(180deg,rgba(18,23,27,.84),rgba(9,12,15,.9));
  border:1px solid var(--glass-line);border-top-color:var(--glass-hi);border-radius:18px;
  padding:36px 36px 30px;text-align:left;box-shadow:var(--shadow);
  backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%);
}
#endCard .tag{color:var(--amber);letter-spacing:5px;font-size:12px}
#endName{font-family:var(--serif);font-size:clamp(30px,6vw,44px);font-weight:600;letter-spacing:9px;margin:12px 0 6px;color:#f2e8d6;text-shadow:0 4px 26px rgba(0,0,0,.8)}
#endGrade{
  position:absolute;right:36px;top:32px;width:76px;height:76px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--serif);font-size:38px;
  border:2px solid var(--gold);color:var(--gold);background:rgba(216,171,85,.10);
  box-shadow:0 0 30px rgba(216,171,85,.22),inset 0 0 20px rgba(216,171,85,.08);
}
#endText{font-family:var(--serif);font-size:16.5px;line-height:2.15;color:var(--ink);margin:16px 0 20px;white-space:pre-wrap}
#fates{border-top:1px dashed var(--glass-line);padding-top:16px;display:grid;gap:7px;font-size:13.5px;color:var(--ink2)}
#fates b{color:var(--amber-2);font-weight:600;margin-right:9px}
#endStats{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px}
#endStats span{border:1px solid var(--glass-line);border-radius:999px;padding:3px 11px;color:var(--ink2);background:rgba(255,255,255,.04)}
#endBtns{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
#endBtns .mbtn{padding:11px 24px;font-size:14px;letter-spacing:3px;margin-top:0}
#endBtns .mbtn:not(.pri){background:rgba(14,19,23,.66);color:var(--ink);border:1px solid var(--glass-line)}

/* 图鉴 */
#gallery h2,#gTitle{font-family:var(--serif);letter-spacing:9px;font-size:clamp(24px,5vw,32px);font-weight:600;color:var(--amber-2);margin-bottom:20px;text-shadow:0 4px 26px rgba(0,0,0,.8)}
#gGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:min(880px,100%)}
.gslot{
  border:1px solid var(--glass-line);border-radius:14px;padding:17px 15px;text-align:left;
  background:linear-gradient(180deg,rgba(20,26,31,.74),rgba(11,15,18,.80));
  box-shadow:var(--shadow-s);  transition:all .3s;
}
.gslot.on{border-color:rgba(216,171,85,.5);background:linear-gradient(180deg,rgba(46,36,18,.72),rgba(24,19,11,.8));box-shadow:var(--shadow-s),0 0 26px rgba(216,171,85,.12)}
.gslot .gn{font-family:var(--serif);font-size:19px;letter-spacing:3px;color:var(--ink)}
.gslot.on .gn{color:var(--gold)}
.gslot .gd{margin-top:7px;font-size:12.5px;color:var(--ink3);line-height:1.75}
.gslot.off{opacity:.45}

/* 风浪 / 面板 */
.waveCard{
  width:min(740px,100%);
  background:linear-gradient(180deg,rgba(18,23,27,.86),rgba(9,12,15,.92));
  border:1px solid var(--glass-line);border-top-color:var(--glass-hi);border-radius:18px;
  padding:28px 28px 22px;text-align:left;box-shadow:var(--shadow);
  max-height:92vh;overflow:auto;
  backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%);
}
.wEra{color:var(--amber);letter-spacing:5px;font-size:12px}
.wTitle{font-family:var(--serif);font-size:clamp(24px,5vw,32px);font-weight:600;letter-spacing:9px;color:#f2e8d6;margin:8px 0 4px;text-shadow:0 4px 26px rgba(0,0,0,.8)}
.wTurn{font-size:13px;color:var(--ink2);margin-bottom:5px}
.wHint{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.wActs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wAct{
  background:linear-gradient(180deg,rgba(20,26,31,.76),rgba(12,16,19,.80));
  border:1px solid var(--glass-line);border-radius:14px;color:var(--ink);
  padding:12px 14px;text-align:left;font-size:14px;font-weight:600;
  box-shadow:var(--shadow-s);transition:all .3s cubic-bezier(.4,0,.2,1);
}
.wAct:hover{transform:translateY(-2px);border-color:rgba(224,160,74,.5);background:linear-gradient(180deg,rgba(40,33,20,.8),rgba(20,17,12,.84))}
.wAct:active{transform:scale(.985)}
.wAct .wd{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:400}
.wLog{margin-top:14px;font-size:13px;color:#9ed0ae;min-height:18px;line-height:1.75;white-space:pre-wrap}
#evBox{margin:12px 0 4px;border:1px solid rgba(224,160,74,.42);border-radius:14px;padding:13px 15px;background:rgba(60,44,20,.42)}
#evBox .et{font-family:var(--serif);color:var(--amber-2);font-size:16px;font-weight:600;margin-bottom:7px;letter-spacing:2px}
#evBox .ed{font-size:13.5px;line-height:1.9;color:var(--ink);margin-bottom:11px;white-space:pre-wrap}
.wSkip{
  margin-top:16px;background:none;border:1px dashed rgba(224,160,74,.45);color:var(--ink3);
  border-radius:999px;padding:7px 18px;font-size:12px;transition:all .3s;
}
.wSkip:hover{color:var(--amber-2);border-color:rgba(224,160,74,.75);transform:scale(1.04)}

.panelCard{
  width:min(580px,100%);
  background:linear-gradient(180deg,rgba(18,23,27,.86),rgba(9,12,15,.92));
  border:1px solid var(--glass-line);border-top-color:var(--glass-hi);border-radius:18px;
  padding:26px;max-height:88vh;overflow:auto;text-align:left;box-shadow:var(--shadow);
  backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%);
}
.pTitle{font-family:var(--serif);letter-spacing:7px;font-size:22px;font-weight:600;color:var(--amber-2);margin-bottom:16px}
.affRow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px dashed var(--glass-line);font-size:14px}
.affRow .av{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:rgba(224,160,74,.12);border:1px solid rgba(224,160,74,.3);font-size:14px}
.affRow .bar{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.affRow .bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px currentColor}
.affRow .st{width:162px;font-size:11.5px;color:var(--ink3);text-align:right;flex:none}
.cardRow{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--glass-line);font-size:13.5px}
.cardRow .cn{color:var(--amber-2);font-family:var(--serif);letter-spacing:3px;flex:none;font-weight:600}
.cardRow .cd{color:var(--ink2);line-height:1.75}
.tabs{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.tabs button{
  background:var(--glass-2);border:1px solid var(--glass-line);color:var(--ink2);
  border-radius:999px;padding:7px 19px;font-size:13px;font-weight:600;letter-spacing:2px;
  transition:all .3s;}
.tabs button:hover{transform:scale(1.05);border-color:rgba(224,160,74,.45);color:var(--ink)}
.tabs button.on{background:linear-gradient(180deg,rgba(224,160,74,.9),rgba(170,112,40,.9));color:#1a1206;border-color:rgba(255,200,120,.5)}
.achGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:10px;width:min(780px,100%)}
.ach{
  border:1px solid var(--glass-line);border-radius:14px;padding:13px 15px;text-align:left;
  background:linear-gradient(180deg,rgba(20,26,31,.74),rgba(11,15,18,.80));
  /* 毛玻璃已按性能考虑移除 */transition:all .3s;
}
.ach.on{border-color:rgba(216,171,85,.48);background:linear-gradient(180deg,rgba(46,36,18,.7),rgba(24,19,11,.8))}
.ach .an{font-size:14.5px;font-weight:600;color:var(--ink)}
.ach.on .an{color:var(--gold)}
.ach .ad{font-size:12px;color:var(--ink3);margin-top:5px;line-height:1.65}
.ach.off{opacity:.5}

#toast{
  position:fixed;left:50%;bottom:132px;transform:translateX(-50%);z-index:80;
  background:linear-gradient(180deg,rgba(224,160,74,.95),rgba(170,112,40,.95));
  color:#1a1206;border-radius:999px;padding:9px 24px;font-size:14px;letter-spacing:3px;
  font-weight:700;opacity:0;pointer-events:none;transition:opacity .5s ease-in-out;
  box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 26px rgba(224,160,74,.3);
}
#toast.show{opacity:1}

/* ==========================================================================
   底部导航（仅窄屏 / 触屏显示）——改善手机端拇指可达性
   ========================================================================== */
#nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab,0px));z-index:40;
  display:none;gap:6px;padding:6px;
  background:rgba(10,14,17,.82);border:1px solid var(--glass-line);border-radius:999px;
  box-shadow:0 12px 36px rgba(0,0,0,.6);
  backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);
}
.navbtn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 15px;border-radius:999px;font-size:11px;letter-spacing:1px;
  white-space:nowrap;line-height:1.15;
  color:var(--ink2);transition:all .28s;
}
.navbtn .ni{font-size:16px;filter:grayscale(.8) sepia(.55) saturate(2.1) hue-rotate(-12deg) brightness(1.08)}
.navbtn:hover,.navbtn:active{background:rgba(224,160,74,.14);color:var(--amber-2)}

/* ==========================================================================
   响应式
   ========================================================================== */
@media (max-width:720px){
  :root{--blur:12px}
  #txt{font-size:16.5px;line-height:1.9}
  #dlg{padding:17px 18px 15px;min-height:120px;border-radius:14px}
  #bottom{padding:10px 12px calc(92px + var(--sab,0px))}
  #hud{padding:calc(8px + var(--sat,0px)) 10px 8px;gap:5px}
  .chip{font-size:11.5px;padding:3px 9px}
  #chTag{font-size:12.5px;letter-spacing:2px}
  .choice{font-size:15px;padding:12px 14px 12px 40px}
  .wActs{grid-template-columns:1fr}
  #figL{left:-9%;width:38%}
  #figR{right:-9%;width:34%}
  #endCard{padding:26px 22px 22px}
  #endGrade{right:22px;top:24px;width:62px;height:62px;font-size:30px}
  #toast{bottom:170px}
  #nav.on{display:flex}
}
/* 触屏设备也显示底部导航 */
@media (hover:none) and (pointer:coarse){
  #nav.on{display:flex}
}

/* 低特效档：安卓低端机 / 用户开启省电时降开销 */
body.lfx #fog{display:none}
body.lfx #sceneEnv{animation:none;transform:none}
body.lfx #titleArt{animation:none;transform:none}
body.lfx #sceneArt .fig svg{animation:none;filter:brightness(0) blur(20px)}
body.lfx .ovl{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(5,7,9,.93)}
body.lfx #dlg,body.lfx .choice,body.lfx .waveCard,body.lfx .panelCard,body.lfx .gslot,body.lfx .ach,body.lfx .wAct,body.lfx #endCard,body.lfx #hud,body.lfx #nav{
  backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(10,14,17,.94)
}
body.lfx .chip,body.lfx #sndBtn,body.lfx .tabs button{backdrop-filter:none;-webkit-backdrop-filter:none}
body.lfx #stage.rainOn #sceneArt::after{animation:none}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ==========================================================================
   V2.6 · 苹果液态玻璃 + 日夜双模 + 底栏液体动效
   本节全部为「同选择器后置覆盖」，不改动上面既有规则，便于对照与回退。
   ========================================================================== */

/* ---------------- 液态玻璃参数 ---------------- */
:root{
  --lg-blur:16px; --lg-sat:180%; --lg-bright:1.05;
  --rim-hi:rgba(255,255,255,.46); --rim-lo:rgba(0,0,0,.34);
  --sheen:rgba(255,255,255,.15);
  --mx:50%; --my:0%;            /* 指针位置，驱动玻璃反光斑 */
  --nav-lens-x:0px; --nav-lens-w:64px;
  /* 安全区兜底：PWA / 浏览器里用 env()，安卓外壳会由原生层用内联样式覆盖 */
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}

/* ---------------- 玻璃表面总配方 ----------------
   透射(高模糊+高饱和) + 镜面边缘高光 + 指针跟随反光斑 */
#dlg,#nav,.waveCard,.panelCard,#endCard,#hud,
.chip,#sndBtn,.choice,.gslot,.ach,.wAct,.tabs button,#who,.navItems{
  background-color:transparent;
  background-image:
    radial-gradient(240px 150px at var(--mx) var(--my),var(--sheen),rgba(255,255,255,0) 70%),
    linear-gradient(180deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.035) 46%,rgba(0,0,0,.16) 100%);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:
    inset 0 1px 0 var(--rim-hi),
    inset 0 -1px 0 var(--rim-lo),
    inset 0 0 0 1px rgba(255,255,255,.03),
    0 16px 44px rgba(0,0,0,.46);
  backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat)) brightness(var(--lg-bright));
  -webkit-backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat)) brightness(var(--lg-bright));
}
/* 承载「主视觉」的几块用真透镜折射（其余保持纯模糊，控制开销） */
#dlg,#nav,#title .mbtn,#era .go{
  backdrop-filter:url(#lgLens) blur(11px) saturate(180%) brightness(1.05);
  -webkit-backdrop-filter:url(#lgLens) blur(11px) saturate(180%) brightness(1.05);
}
.waveCard,.panelCard,#endCard{
  backdrop-filter:url(#lgLens) blur(16px) saturate(170%) brightness(1.04);
  -webkit-backdrop-filter:url(#lgLens) blur(16px) saturate(170%) brightness(1.04);
}

/* 状态栏只做上缘高光与模糊（长条做折射会拉花），但保留玻璃观感 */
#hud{border:none;border-bottom:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 14px 36px rgba(0,0,0,.42)}

/* 实心琥珀按钮：保留填充，只补玻璃镜面边与内高光 */
.mbtn,#era .go{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.28),
    0 12px 34px rgba(0,0,0,.5),
    0 0 28px rgba(224,160,74,.22);
}
#title .mbtn:not(.pri){background:linear-gradient(180deg,rgba(28,34,40,.62),rgba(14,19,24,.72))}

/* 带语义色底的面要保住自己的色相，不能被统一玻璃底盖掉 */
.choice.cardOpt{
  background-image:
    radial-gradient(240px 150px at var(--mx) var(--my),rgba(255,214,150,.22),rgba(255,255,255,0) 70%),
    linear-gradient(180deg,rgba(224,160,74,.20),rgba(120,80,26,.14) 50%,rgba(0,0,0,.18));
  border-color:rgba(224,160,74,.45);
}
.chip.warn{
  background-image:linear-gradient(180deg,rgba(217,99,79,.30),rgba(120,34,26,.34));
  border-color:rgba(217,99,79,.6);
}
.choice.lock{opacity:.42}
.choice:hover{
  background-image:
    radial-gradient(260px 160px at var(--mx) var(--my),rgba(255,255,255,.20),rgba(255,255,255,0) 70%),
    linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 46%,rgba(0,0,0,.16));
  border-color:rgba(255,255,255,.30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.34),0 18px 48px rgba(0,0,0,.5);
}
.tabs button.on{background-image:linear-gradient(180deg,rgba(224,160,74,.92),rgba(170,112,40,.92));border-color:rgba(255,220,160,.6)}

/* ---------------- 覆盖层：修掉 flex 居中 + overflow 的裁切 ----------------
   原写法 justify-content:center 在内容超高时会把**起始端顶出可视区**且滚不到
   （图鉴标题与标签栏就是这么被切没的）。
   正确解法不是给所有子元素 margin:auto（多子元素会互相分摊空间，把标签栏挤变形），
   而是：主轴改成 flex-start、只给「第一个子元素」上外边距 auto、
   「最后一个子元素」下外边距 auto —— 有富余时整体居中，超出时 auto 归零、可正常滚动。 */
.ovl{
  align-items:center;justify-content:flex-start;
  padding:calc(20px + var(--sat,0px)) 20px calc(20px + var(--sab,0px));
}
.ovl>*:first-child{margin-top:auto}
.ovl>*:last-child{margin-bottom:auto}
.tabs button{flex:0 0 auto;white-space:nowrap}

/* ---------------- 底栏：液态玻璃滑动透镜 ---------------- */
#nav{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + var(--sab,0px));z-index:40;
  display:none;padding:6px;border-radius:999px;isolation:isolate;
}
#nav.on{display:block}
.navItems{position:relative;z-index:2;display:flex;gap:2px;
  background:none;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
/* 透镜层：白色实心药丸，交给 goo 滤镜融合 */
.navGoo{
  position:absolute;inset:6px;z-index:1;pointer-events:none;
  filter:url(#lgGoo);
}
.navLens,.navTrail{
  position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:#fff;
  width:var(--nav-lens-w);
  transition:transform .46s cubic-bezier(.34,1.32,.5,1),width .46s cubic-bezier(.34,1.32,.5,1);
  will-change:transform,width;
}
.navTrail{opacity:.85;transition-delay:.06s;
  transition-timing-function:cubic-bezier(.4,1.1,.5,1)}
/* goo 只作用于透镜层，文字层在它上面保持锐利 */
.navLens{transform:translateX(var(--nav-lens-x))}
.navTrail{transform:translateX(var(--nav-lens-x))}
#nav.moving .navLens{filter:blur(1px)}
#nav.moving .navTrail{filter:blur(3px)}
/* 玻璃剪切层：真正带折射的玻璃透镜（会被 goo 形状裁切） */
.navLens{ -webkit-mask:none }

.navbtn{
  position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 20px;border-radius:999px;font-size:11.5px;letter-spacing:1px;
  white-space:nowrap;line-height:1.15;border:1px solid transparent;background:none!important;
  box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  color:var(--ink2);transition:color .3s,transform .28s cubic-bezier(.34,1.4,.5,1);
}
.navbtn.active{color:#141a1f;font-weight:700}
.navbtn:active{transform:scale(.94)}
.navbtn .ni{font-size:16px;filter:grayscale(.8) sepia(.55) saturate(2.1) hue-rotate(-12deg) brightness(1.08);transition:filter .3s}
.navbtn.active .ni{filter:grayscale(.85) sepia(.5) saturate(2.4) hue-rotate(-14deg) brightness(.72)}

/* ---- 按住横滑切换（iOS 液态玻璃 Tab Bar 交互） ----
   蒙版：明确告诉用户「此刻正在切换界面」 */
#navScrim{
  position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;
  /* 只压一层暗角示意「正在切换界面」。v2.6 这里还叠了整页 blur(2px)，
     截图里正文糊成一片完全读不了，撤掉。 */
  background:radial-gradient(ellipse at 50% 98%,rgba(0,0,0,0) 30%,rgba(0,0,0,.28) 64%,rgba(0,0,0,.52) 100%);
  transition:opacity .24s ease-out;
}
#navScrim.on{opacity:1}
#nav.sliding{border-color:rgba(255,255,255,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.62),inset 0 -1px 0 rgba(0,0,0,.34),0 22px 56px rgba(0,0,0,.55)}
/* 滑动中透镜要紧跟手指：关掉过渡 */
#nav.sliding .navLens,#nav.sliding .navTrail{transition:none}
/* 无动画定位（首帧 / 旋转 / 重排）—— 与 .sliding 分开，否则会把交互态一起摘掉 */
#nav.noanim .navLens,#nav.noanim .navTrail{transition:none}
#nav.sliding .navGoo{filter:url(#lgGoo) blur(.4px)}
/* 手指当前压住的那一项，此刻就该像选中态一样反白 */
#nav.sliding .navbtn.hot{color:#141a1f;font-weight:700}
#nav.sliding .navbtn.hot .ni{filter:grayscale(.85) sepia(.5) saturate(2.4) hue-rotate(-14deg) brightness(.72)}
/* 手指正压住的是 .hot，原来的 .active 必须让位——
   否则暗底深字（.active 的颜色）叠在一起，那个标签等于看不见。 */
#nav.sliding .navbtn.active:not(.hot){color:var(--ink2);font-weight:400}
#nav.sliding .navbtn.active:not(.hot) .ni{filter:grayscale(.8) sepia(.55) saturate(2.1) hue-rotate(-12deg) brightness(1.08)}
html[data-theme="day"] #nav.sliding .navbtn.hot{color:#141a1f}

/* ---------------- 拖拽：跟随指针的玻璃透镜 ---------------- */
#dragLens{
  position:fixed;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;
  border-radius:50%;pointer-events:none;z-index:70;opacity:0;
  transition:opacity .18s ease-out,transform .09s linear;
  background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.30),rgba(255,255,255,.05) 44%,rgba(255,255,255,0) 72%);
  border:1px solid rgba(255,255,255,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.26),0 18px 44px rgba(0,0,0,.45);
  backdrop-filter:url(#lgLensStrong) blur(6px) saturate(195%) brightness(1.10);
  -webkit-backdrop-filter:url(#lgLensStrong) blur(6px) saturate(195%) brightness(1.10);
  transform:translate3d(var(--lx,0px),var(--ly,0px),0) scale(.6);
}
#dragLens.on{opacity:1;transform:translate3d(var(--lx,0px),var(--ly,0px),0) scale(1)}
body.dragging #choices{filter:saturate(.5) brightness(.74)}
.choice.dragOver{
  background-image:
    radial-gradient(260px 160px at var(--mx) var(--my),rgba(255,224,170,.34),rgba(255,255,255,0) 72%),
    linear-gradient(180deg,rgba(255,214,150,.26),rgba(120,80,26,.18) 50%,rgba(0,0,0,.18))!important;
  border-color:rgba(255,214,150,.8)!important;
  transform:translateX(5px) scale(1.025);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 40px rgba(224,160,74,.4),0 18px 46px rgba(0,0,0,.5)!important;
}
.choice.dragging{transform:scale(.972);opacity:.7}

/* ---------------- 日间模式 ----------------
   不是反色：日间用亮玻璃 + 深字，同时把照片的压暗与暗角调轻，
   保证「白天看得到景、也读得清字」。 */
html[data-theme="day"]{
  --bg0:#e9e3d8; --bg1:#f2ede4; --bg2:#fbf8f2;
  --glass:rgba(255,255,255,.74); --glass-2:rgba(255,255,255,.64);
  --glass-line:rgba(28,33,38,.14); --glass-hi:rgba(255,255,255,.95);
  --ink:#1b2126; --ink2:#4b555c; --ink3:#78838a;
  --amber:#a86a17; --amber-2:#8a5510; --amber-3:#c98a2e;
  --teal:#2c6570; --teal-2:#3f8892;
  --danger:#b8442f; --ok:#3f7d59; --gold:#a97f22;
  --line:rgba(28,33,38,.12);
  --sheen:rgba(255,255,255,.55);
  --rim-hi:rgba(255,255,255,.95); --rim-lo:rgba(28,33,38,.14);
  --lg-bright:1.02;
}
html[data-theme="day"] body{background:linear-gradient(180deg,#f5f1e9,#e6e0d4)}
/* 日间：只轻压一层暖白，保留照片的对比与层次（压太狠会整片发灰） */
html[data-theme="day"] #scenePhotoTint{
  background:
    linear-gradient(180deg,rgba(255,252,246,.40) 0%,rgba(255,252,246,.10) 26%,rgba(255,252,246,.02) 44%,rgba(250,246,238,.30) 74%,rgba(243,238,228,.66) 100%),
    radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 48%,rgba(40,34,24,.18) 100%);
}
html[data-theme="day"] #fog{opacity:.22;mix-blend-mode:soft-light}
html[data-theme="day"] #txt{color:#141a1e;text-shadow:none}
html[data-theme="day"] #who{color:#7a4a0d;border-color:rgba(168,106,23,.4)}
/* 透镜药丸在任何主题下都是白玻璃，所以选中态文字必须始终是深色 */
html[data-theme="day"] .navbtn.active{color:#141a1f}
html[data-theme="day"] .navbtn.active .ni{filter:grayscale(.85) sepia(.5) saturate(2.4) hue-rotate(-14deg) brightness(.75)}
html[data-theme="day"] #hint{color:#8a5510}
html[data-theme="day"] #title::after{
  background:
    linear-gradient(180deg,rgba(28,24,18,.55) 0%,rgba(28,24,18,.18) 26%,rgba(24,20,14,.30) 58%,rgba(18,15,10,.78) 100%),
    radial-gradient(ellipse at 50% 44%,rgba(0,0,0,0) 34%,rgba(0,0,0,.42) 100%);
}
html[data-theme="day"] #title h1{color:#fffaf0}
html[data-theme="day"] #title .desc{color:#e8ddc9}
html[data-theme="day"] #endName,html[data-theme="day"] .wTitle{color:#1b2126}
html[data-theme="day"] #sceneArt .fig svg{opacity:.32}
html[data-theme="day"] .wLog{color:#2f6b48}
/* 日间模式的顶栏：v2.6 忘了盖 #hud，白天顶上看还是一条深色横带 */
html[data-theme="day"] #hud{
  background:linear-gradient(180deg,rgba(253,250,245,.94) 0%,rgba(250,246,238,.66) 100%);
  border-bottom-color:rgba(28,33,38,.10);box-shadow:0 10px 26px rgba(90,78,56,.14);
}
html[data-theme="day"] #chTag{color:#8a5510;text-shadow:none}
html[data-theme="day"] .chip b{color:#7a4a0d}
html[data-theme="day"] .chip.warn{background-image:linear-gradient(180deg,rgba(217,99,79,.24),rgba(150,60,42,.20));color:#8c3a26}
html[data-theme="day"] .chip.warn b{color:#a33418}
html[data-theme="day"] #sndBtn,html[data-theme="day"] #themeBtn,html[data-theme="day"] #fxBtn{color:var(--ink2)}

/* ---------------- 主题切换按钮 ---------------- */
#themeBtn{
  margin-left:auto;background:var(--glass-2);border:1px solid var(--glass-line);
  color:var(--ink2);border-radius:999px;padding:4px 13px;font-size:12.5px;
  transition:all .3s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#themeBtn:hover{color:var(--amber-2);border-color:rgba(224,160,74,.5);transform:scale(1.05)}
#themeBtn .e{filter:grayscale(.8) sepia(.55) saturate(2.1) hue-rotate(-12deg) brightness(1.06)}
#fxBtn{
  background:var(--glass-2);border:1px solid var(--glass-line);color:var(--ink2);
  border-radius:999px;padding:4px 11px;font-size:14px;line-height:1;transition:all .3s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#fxBtn:hover{color:var(--amber-2);border-color:rgba(224,160,74,.5);transform:scale(1.05)}
#fxBtn .e{filter:grayscale(.8) sepia(.55) saturate(2.1) hue-rotate(-12deg) brightness(1.06)}
/* 窄屏微调：✨ 特效键上线后第二行放不下，会把整条 HUD 顶成三行。
   收紧这几个药丸的内边距即可同行放下（412px 下实测 370/392px）。 */
@media (max-width:720px){
  .chip{padding:3px 8px}
  #sndBtn,#themeBtn{padding:4px 9px;font-size:12px}
  #fxBtn{padding:4px 7px;font-size:13px}
}
/* 切主题时给一次柔和过渡，避免生硬跳变 */
html.themeAnim,html.themeAnim *{transition:background-color .35s ease-out,color .35s ease-out,border-color .35s ease-out!important}

/* ---------------- 低特效档统一降级 ---------------- */
body.lfx #dlg,body.lfx #nav,body.lfx .waveCard,body.lfx .panelCard,body.lfx #endCard,
body.lfx #hud,body.lfx .chip,body.lfx #sndBtn,body.lfx .choice,body.lfx .gslot,body.lfx .ach,
body.lfx .wAct,body.lfx .tabs button,body.lfx #who,body.lfx .navItems{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  background-image:linear-gradient(180deg,rgba(16,21,26,.94),rgba(9,13,16,.96))!important;
}
html[data-theme="day"] body.lfx #dlg,html[data-theme="day"] body.lfx .choice,
html[data-theme="day"] body.lfx .gslot,html[data-theme="day"] body.lfx .ach,
html[data-theme="day"] body.lfx .wAct,html[data-theme="day"] body.lfx .panelCard,
html[data-theme="day"] body.lfx .waveCard,html[data-theme="day"] body.lfx #endCard,
html[data-theme="day"] body.lfx #hud,html[data-theme="day"] body.lfx .chip,
html[data-theme="day"] body.lfx #sndBtn,html[data-theme="day"] body.lfx #nav{
  background-image:linear-gradient(180deg,rgba(255,253,248,.97),rgba(243,238,228,.97))!important;
}
body.lfx .navGoo{filter:none}
body.lfx #dragLens{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.16)}
body.lfx #nav.moving .navLens,body.lfx #nav.moving .navTrail{filter:none}

</style>

c1_8:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["me","半个月后，一张烫金请帖塞进鱼摊：白金瀚夜总会，徐老板请你喝茶。"],
  ["xu","高启强。旧厂街的高启强。我儿子的命，没在你那鱼池里，我派人查了二十遍。你说说，你一个卖鱼的，那天晚上到底看见什么了？"],
  ["qin","他眼睛是红的。丧子的人，刀架在你脖子上都不解恨。"]],
 choices:[
  {t:"『扑通』跪下：徐老板饶命，我真的什么都没看见",fx:{rep:-10,heart:-6},set:{guiguo:true},note:"声望 -10",next:"c1_9"},
  {t:"一句不说，硬扛着他的目光",fx:{heart:-2,rep:4},note:"声望 +4",next:"c1_9"},
  {t:"翻开《孙子兵法》的底子：『徐老板，配电箱漏电，电工的检修记录我抄了一份。您要真凶，先查电。』",req:{stat:"con",min:8},fx:{con:6,rep:8,risk:6},note:"人脉 +6 声望 +8",next:"c1_9"}],
 cardOpts:{mantian:{t:"顺着他的话，把『查电』的差事应下来——拖字诀走起",fx:{risk:-8,rep:2},next:"c1_9"}}},
c1_9:{bg:"bg-rain",deco:"🔪",
 lines:[
  ["me","茶没喝完，事情就来了。当夜，四条汉子堵了鱼摊，铁棍敲得案板梆梆响：徐老板说了，鱼摊明天就别开了。"],
  ["qin","手边有杀鱼刀，案板上还有半条冻得梆硬的带鱼。命，和往后二十年的路，都在这一下。"]],
 choices:[
  {t:"拎起冻鱼，跟他们拼了！",fx:{rep:10,risk:12,heart:-8},set:{eming:true},note:"声望 +10 风险 +12",next:"c1_10"},
  {t:"抄起名片打给安欣，死死守住电话不挂",fx:{heart:6,risk:-6,rep:2},note:"初心 +6 风险 -6",next:"c1_10"},
  {t:"把攒的五千块钱全推过去，破财消灾",fx:{money:-5000,heart:-4},note:"资金 -5000",next:"c1_10"}]},
c1_10:{bg:"bg-market",deco:"🌅",
 lines:[
  ["me","那条街还是那条街。鱼还是要进，秤还是要摆。可旧厂街的人再看你，眼神不一样了。"],
  ["qin","风浪来过了。有人被浪打翻，有人学会了踩着浪走。我想做后一种。"]],
 choices:[
  {t:"本本分分卖鱼，供弟妹读完书，别的不沾",fx:{heart:8,rep:2,money:1000},set:{anfen:true},note:"初心 +8",next:"c1_chk"},
  {t:"提两瓶好酒，去拜泰叔的码头，想活得好就得有人罩着",fx:{con:8,risk:8,rep:4,money:-1000},note:"人脉 +8 风险 +8",next:"c1_chk"},
  {t:"拉上启盛倒腾电器BB机，做生意攒本钱",fx:{money:3000,con:3,rep:2},note:"资金 +3000",next:"c1_chk"}]},
c1_chk:{hidden:true,route:s=>s.risk>=70?"g_rain":"w1",alt:["g_rain","w1"]},
w1:{wave:"w1",next:"c2_1a"},

/* ---------- 第二章 2006 · 风起于萍末 ---------- */
c2_1a:{era:{y:"第 二 章 · 二 ○ ○ 六",t:"风起于萍末",s:"白金瀚的霓虹，比鱼市的白炽灯亮得多，也烫得多。",chap:2},next:"c2_1"},
c2_1:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["me","六年，弹指一挥。旧厂街的鱼摊变成了水产档口，你的名字在京海的水产圈里有了分量。这一年，两个女人一个男人，先后走进你的命里。"],
  ["sao","高老板，坐。听说徐江的人为难你？我是陈书婷，白家的当家人。京海地面上的事，轮不到他一个人说了算。"]],next:"c2_2"},
c2_2:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["sao","我这人不喜欢绕弯子。白金瀚、白家的场子，缺一个能压得住场面的人。你敢不敢接？"],
  ["qin","她递过来的不是酒杯，是一把椅子。接，还是不接。"]],next:"c2_2b"},
c2_2b:{bg:"bg-market",deco:"🔪",
 lines:[
  ["me","菜场西口，一个刚出狱的男人守着个修车摊，被人掀了摊子也不还手。你认得他——老默，当年进去了几年，出来老婆没了，就剩一个闺女。"],
  ["mo","高老板。不用可怜我。我就是……想给丫丫挣个学费。"],
  ["qin","这人眼里有一种东西，像深海里的鱼，不出声，但知道往哪儿游。"]],
 choices:[
  {t:"『西口那个摊位归你。往后你跟我，我养你们父女。』",fx:{heart:6,con:5,affMo:8},set:{laomo:true},note:"初心 +6 人脉 +5",next:"c2_3"},
  {t:"雇他看场子，但钱按行价再压三成——便宜好用",fx:{con:6,heart:-4,affMo:4},set:{laomo:true},note:"人脉 +6",next:"c2_3"},
  {t:"点头致意，各过各的日子",fx:{heart:2,affMo:1},note:"初心 +2",next:"c2_3"}]},
c2_3:{bg:"bg-jinhan",deco:"🐺",
 lines:[
  ["me","徐江的时代到头了。线人反水、账本外流、白金瀚的股东连夜撤资，他成了京海人人都想踩一脚的落水狗。今夜，他孤身来见你。"],
  ["xu","高启强！成王败寇，我认。但京海这么大，你就不怕我姓徐的哪天缓过来，再跟你算今天的账？"],
  ["qin","他身后已经没有兄弟了。可饿狼就是饿狼。"]],
 choices:[
  {t:"递给老默一根烟：『告诉老默，我想吃鱼了。』",req:{flag:"laomo"},fx:{rep:12,risk:14,heart:-10},set:{xuezhai1:true},note:"声望 +12 风险 +14",next:"c2_4"},
  {t:"连夜把他和账目一起送到安欣手里，交由法律发落",fx:{heart:10,risk:-8,rep:6},note:"初心 +10 风险 -8",next:"c2_4"},
  {t:"放他离开京海：『我高启强不斩落水狗。』",fx:{rep:-4,risk:8,heart:2},set:{fanghu:true},note:"风险 +8",next:"c2_4"}],
 cardOpts:{jiedao:{t:"把徐江仇家的名单，递给急着上位的人",fx:{rep:10,con:4,heart:-8,risk:4},next:"c2_4"}}},
c2_4:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["me","泰叔的寿宴。满堂宾客里，老爷子招手让你过去，把一根不离手的枣木拐杖放在你面前。"],
  ["tai","启强啊。这根拐杖，我拄了三十年，京海没人敢扶。今天你扶一下试试？"],
  ["qin","满场的人都盯着。这一扶，就是他陈泰的人了。"]],next:"c2_5"},
c2_5:{bg:"bg-jinhan",deco:"🐉",
 lines:[
  ["qin","扶，还是不扶。"]],
 choices:[
  {t:"双膝跪地，端茶认干爹：『爹在上，受儿子一拜。』",fx:{con:12,rep:6,heart:-8},set:{taishu:true},note:"人脉 +12 声望 +6",next:"c2_5b"},
  {t:"不跪。双手抱拳，只把拐杖扶正放好：『叔，我敬您，但跪不下去。』",fx:{rep:10,con:4},set:{yinggutou:true},note:"声望 +10",next:"c2_5b"}],
 cardOpts:{fanke:{t:"不跪也不接——反手把白金瀚三成干股的协议推到泰叔面前",fx:{rep:14,con:8,heart:-2},set:{pingdeng:true},next:"c2_5b"}}},
c2_5b:{bg:"bg-jinhan",deco:"🌹",
 lines:[
  ["sao","高启强，跟着你这几年，我看得明白：你这个人，心里有一杆秤。我的场子，我这个人，你敢不敢一起接？"],
  ["qin","大嫂笑了。京海谁不知道，能得到陈书婷一句『敢』，半个白金瀚就姓了高。"]],
 choices:[
  {t:"『娶。这辈子，高启强明媒正娶。』",fx:{rep:8,heart:4,affSao:8},set:{marry:true},note:"声望 +8",next:"c2_6"},
  {t:"『书婷，我现在满手是泥，配不上你。等我洗干净……』",fx:{rep:-6,heart:6,affSao:3},note:"初心 +6",next:"c2_6"}]},
c2_6:{bg:"bg-tower",deco:"🕶️",
 lines:[
  ["me","这一年，启盛的小灵通柜台开进了三家商场。他站在柜台后面给人家讲『信号增强专利』，眼睛亮得吓人。"],
  ["sheng","哥，柜台叫什么名字，我想好了——就叫『强盛』。强的强，盛的盛。咱高家，从此往上走！"],
  ["qin","强盛。鱼摊的名字跟着我们二十年了，从今天起，它有了新的意思。"]],
 choices:[
  {t:"把全部积蓄押进去，兄弟俩合伙干",fx:{money:-20000,rep:8,con:6,affSheng:4},set:{qiangsheng:true},note:"资金 -20000 声望 +8",next:"c2_7"},
  {t:"只出面子不出钱：『哥给你站台，账你自己管。』",fx:{rep:4,con:3,affSheng:3},set:{qiangsheng:true},note:"声望 +4",next:"c2_7"},
  {t:"劝他收手：『小灵通火不了几年，安安稳稳比什么都强。』",fx:{heart:6,rep:-4,affSheng:2},note:"初心 +6",next:"c2_7"}]},
c2_7:{bg:"bg-jinhan",deco:"🌃",
 lines:[
  ["me","2006年冬天，『强盛商贸有限公司』挂牌。鞭炮屑落满门口，像一场红色的雪。"],
  ["me","泰叔老了，白金瀚的钥匙一点点挪进你口袋。京海的人提起高启强，不再说『卖鱼的』，而是压低声音说——『强哥』。"]],
 choices:[
  {t:"接下他递来的烟，陪他在天台看一夜的京海",fx:{rep:4,con:4,risk:4},note:"声望 +4 人脉 +4",next:"c2_chk"},
  {t:"把烟掐了：『叔，烟伤肺。咱们讲生意。』",fx:{rep:6,heart:2},note:"声望 +6",next:"c2_chk"}]},
c2_chk:{hidden:true,route:s=>s.risk>=75?"g_gun":"w2",alt:["g_gun","w2"]},
w2:{wave:"w2",next:"c3_1a"},

/* ---------- 第三章 2015 · 京海之巅 ---------- */
c3_1a:{era:{y:"第 三 章 · 二 ○ 一 五",t:"京海之巅",s:"强盛大厦六十六层，整面落地窗外，就是整个京海。",chap:3},next:"c3_1"},
c3_1:{bg:"bg-tower",deco:"🏙️",
 lines:[
  ["me","2015年。强盛集团总部大楼落成，66层，京海第三高楼。剪彩那天的红绸，比当年鱼摊的塑料袋贵一万倍。"],
  ["me","地产、商贸、娱乐、物流——集团的版图铺满京海。你站在顶层落地窗前，脚下是车流，是灯火，是你从鱼摊一步一步走上来的这座城。"],
  ["qin","风浪越大，鱼越贵。这句话，我用了十五年。"]],next:"c3_2"},
c3_2:{bg:"bg-tower",deco:"🎩",
 lines:[
  ["me","深夜，一辆黑色轿车停进地下车库。市委常委、政法委书记赵立冬的秘书递来一份文件。"],
  ["zhao","高总，强盛能长这么大，靠什么，你心里有数吧。市里项目要做优做大，你这两成干股，就是投名状。往后你的事，就是我的事。"],
  ["qin","官帽比黑金可怕，也比黑金好使。可这东西一旦接了，就再没有回头路。"]],
 choices:[
  {t:"签字，递干股。这把伞，不要白不要",fx:{con:12,risk:18,heart:-12},set:{sanhu:true},note:"人脉 +12 风险 +18",next:"c3_3"},
  {t:"虚与委蛇：『赵书记，容我先做做股东们的思想工作。』",fx:{con:4,risk:8},note:"风险 +8",next:"c3_3"},
  {t:"当场拒绝，顺手把录音笔留在了茶几上",fx:{risk:20,heart:6},set:{babing:true},note:"风险 +20 初心 +6",next:"c3_3"}],
 cardOpts:{jinchani:{t:"假意应承，把干股挂进三家空壳公司里",fx:{con:6,risk:4},next:"c3_3"}}},
c3_3:{bg:"bg-rain",deco:"🌩️",
 lines:[
  ["me","莽村的旧厂改造，村民堵了强盛的工地三个月。谈判那天，李宏伟带着人掀了桌，泼了启盛一身茶。"],
  ["me","三天后，李宏伟被发现死在冷库，凶器——是一条冻鱼。启盛坐在审讯室里，眼镜碎了，笑得很平静。"],
  ["sheng","哥，我替你把脏活干了。你说过，风浪越大，鱼越贵。"],
  ["qin","我什么时候让你去杀人了！……启盛是我弟弟。这一步怎么落，落下去就再也收不回来。"]],
 choices:[
  {t:"动用一切关系把案子压下来。弟弟，哥保",fx:{risk:18,con:8,heart:-14},set:{xuezhan:true},note:"风险 +18 人脉 +8",next:"c3_4"},
  {t:"连夜送启盛去自首。大义灭亲，哥陪你一起担",fx:{heart:14,rep:-8,risk:-10},set:{dayi:true},note:"初心 +14 风险 -10",next:"c3_4"},
  {t:"花大钱送他出国，永远别回来",fx:{money:-2000000,risk:8,heart:-6},set:{chuguo:true},note:"资金 -200万",next:"c3_4"},
  {t:"在审讯室外陪他坐了一整夜，一句话不说",req:{aff:"sheng",min:70},fx:{heart:8,affSheng:8},note:"初心 +8",next:"c3_4"}],
 cardOpts:{yiyi:{t:"按兵不动，停工耗到莽村自己内讧",fx:{risk:-6,rep:2,heart:2},next:"c3_4"}}},
c3_4:{bg:"bg-rain",deco:"👮",
 lines:[
  ["me","深秋雨夜。旧厂街拆迁后的空地上，你看见一个白头发的男人站在路灯下——安欣。二十年，他把头发熬白了，人瘦得像一根警徽上的钢针。"],
  ["an","高启强。二十年前除夕，你在这儿卖鱼，我在值班室给你买过一份饺子。二十年，你从鱼摊走到了六十六层。我就想问问你——值吗？"],
  ["qin","他不是来抓我的。他是来接我回家的。可回哪个家？"]],
 choices:[
  {t:"『安欣，回头吧，你斗不赢整个京海。』",fx:{heart:-4,con:2,affAn:-2},note:"初心 -4",next:"c3_5"},
  {t:"『我们本可以做一辈子朋友。是我自己选了另一条路。』",fx:{heart:8,affAn:5},set:{liangzhi:true},note:"初心 +8",next:"c3_5"},
  {t:"把一份赵立冬的罪证线索，悄悄推到他脚边",req:{flag:"babing"},fx:{heart:12,risk:-6,affAn:6},set:{anxin_xiansuo:true},note:"初心 +12 风险 -6",next:"c3_5"},
  {t:"握住他的手：『安欣，如果我先伸手，你还接吗？』",req:{aff:"an",min:70},fx:{heart:10,affAn:8},set:{liangzhi:true},note:"初心 +10",next:"c3_5"}]},
c3_5:{bg:"bg-jinhan",deco:"🔪",
 lines:[
  ["me","地下车库。老默拉开车门坐进来，像每一次那样，先给丫丫的家教费报了账。然后他压低声音。"],
  ["mo","强哥。安欣的住址、巡逻班次，都摸清了。您一句话——今晚，吃鱼吗？"],
  ["qin","车里静得能听见心跳。老默的手，稳得像二十年前那个修车摊。"]],
 choices:[
  {t:"『老默，把名单烧了。安欣，不许动。』",fx:{heart:12,con:2},set:{baoanxin:true},note:"初心 +12",next:"c3_6"},
  {t:"沉默十秒，说：『按你的想法办。』",fx:{heart:-18,risk:14},set:{xuezhai2:true},note:"初心 -18 风险 +14",next:"c3_6"}]},
c3_6:{bg:"bg-tower",deco:"🎀",
 lines:[
  ["me","又是几年。大嫂走的那天，京海下了很大的雨。从那以后，陪你吃饭的人，只剩下瑶瑶。"],
  ["yao","爸。我整理了书房，发现一个上锁的抽屉……我没开。我只是想问，咱家的钱，都是干干净净的吗？"],
  ["qin","她眼里有大嫂的影子。她要是干净，就让她干净到底。"]],
 choices:[
  {t:"教她看报表、管账目——黄家的女儿，要接得住盘子",fx:{con:6,rep:4,affYao:5},note:"人脉 +6",next:"w3"},
  {t:"『瑶瑶，听话。这个抽屉，永远别打开。毕业后离开京海。』",fx:{heart:10,affYao:6},set:{yaogan:true},note:"初心 +10",next:"w3"},
  {t:"什么也不说，只是摸了摸她的头",fx:{heart:2,affYao:3},next:"w3"}]},
w3:{wave:"w3",next:"c3_chk"},
c3_chk:{hidden:true,route:s=>s.risk>=75?"g_net":"c4_1a",alt:["g_net","c4_1a"]},

/* ---------- 第四章 2021 · 潮水退去 ---------- */
c4_1a:{era:{y:"第 四 章 · 二 ○ 二 一",t:"潮水退去",s:"教育整顿驻点指导组进驻京海。潮水退去的时候，才知道谁在裸泳。",chap:4},next:"c4_1"},
c4_1:{bg:"bg-rain",deco:"📋",
 lines:[
  ["me","2021年。中央教育整顿驻点指导组进驻京海，组长徐忠。指导组的车子碾过雨水，停在强盛大厦楼下那天，整座城市都听见了。"],
  ["me","唐小龙被带走的那晚，强盛大厦的灯一盏一盏熄灭。京海的报纸用了一个词——『收网』。"]],
 choices:[
  {t:"紧急召开家族会议，商量对策",next:"c4_2"}]},
c4_2:{bg:"bg-rain",deco:"🎩",
 lines:[
  ["me","电视里，赵立冬戴着手铐走下警车。镜头扫过，他忽然朝镜头笑了笑——所有人都知道那个笑是什么意思。"],
  ["xz","高启强同志，指导组这里，有一份1996年到2021年的清单，越来越长。我们是来听你说的，不是来抓你——今天。"]],
 choices:[{t:"静观其变，等指导组先出牌",fx:{heart:1},next:"c4_3"}],
 cardOpts:{yuanjiao:{t:"抢先向指导组交出赵立冬的罪证，变被动为主动",fx:{risk:-10,heart:4},set:{tanzhu:true},next:"c4_3"}}},
c4_3:{bg:"bg-cell",deco:"🎀",
 lines:[
  ["me","深夜，书房。黄瑶坐在你对面，桌上摆着一个打开的抽屉，和一本泛黄的账本。"],
  ["yao","爸。账本我全看完了。白叔的事、徐江的事、启盛叔的事……我抱着它坐了一整夜。指导组的人说，你可以选。"],
  ["qin","我养大的姑娘，替我打开了最后一个抽屉。这一夜，谁都别想再骗自己了。"]],
 choices:[
  {t:"抢过账本，塞进壁炉。烧了它，烧了就干净了",fx:{heart:-16,risk:6,affYao:-8},set:{shaozhang:true},note:"初心 -16",next:"c4_4"},
  {t:"把账本推到她面前：『瑶瑶，交出去。这是爸最后能做的事。』",fx:{heart:16,affYao:8},set:{renzui:true},note:"初心 +16",next:"c4_4"},

 o.type=type||"sine";o.frequency.value=f;g.gain.value=vol||.05;o.connect(g);g.connect(a.destination);
 o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d);}catch(e){}}

 if(!fx)return;const map={money:"c_money",rep:"c_rep",con:"c_con",risk:"c_risk",heart:"c_heart"};
 for(const k in fx){const v=fx[k];if(!v)continue;
  if(k.slice(0,3)==="aff"){const id=k.slice(3).toLowerCase();if(st.aff[id]===undefined)continue;
   st.aff[id]=clamp(st.aff[id]+v);flo($("c_aff"),(v>0?"+":"")+v+" "+AFF[id].n,v>0);continue;}
  if(k==="money")st.money=Math.max(0,st.money+v);else st[k]=clamp(st[k]+v);
  flo($(map[k]),(k==="money"?((v>0?"+":"")+fmtMoney(v)):((v>0?"+":"")+v)),v>0);

/* ================= 自检 ================= */
window.__qa=function(n){
 n=n||300;const errs=[];let ends=0;
 // 静态：next 引用与 alt 枚举
 for(const id in S){const s=S[id];
  if(typeof showEra!=="function")errs.push("showEra 函数缺失");
  if(s.era&&!s.next)errs.push(id+" era 缺少 next");
  if(s.wave&&!WAVES[s.wave])errs.push(id+" 未知风浪 "+s.wave);
  if(s.cardOpts)for(const k in s.cardOpts){if(!CARDS[k])errs.push(id+" 未知卡牌 "+k);
   const c=s.cardOpts[k];if(c.next&&!S[c.next])errs.push(id+" 卡牌选项缺失 "+c.next);}
  if(s.next&&typeof s.next!=="function"&&!S[s.next])errs.push(id+" -> 缺失节点 "+s.next);
  if(s.alt)s.alt.forEach(a=>{if(!S[a])errs.push(id+" alt 缺失 "+a)});
  if(s.choices)s.choices.forEach((c,i)=>{if(c.next&&typeof c.next!=="function"&&!S[c.next])errs.push(id+" 选择"+i+" 缺失 "+c.next)});
  if(!s.lines&&!s.choices&&!s.ending&&!s.hidden&&!s.era&&!s.wave)errs.push(id+" 空节点");}
 // 动态：随机通关
 for(let t=0;t<n;t++){const s0=fresh();let node="c1_1",steps=0;
  try{while(steps++<300){const sc=S[node];
   if(!sc){errs.push("运行期缺失节点 "+node);break;}
   if(sc.ending){ends++;break;}
   if(sc.hidden){node=sc.route(s0);continue;}
   if(sc.wave){const W=WAVES[sc.wave];let t=0;
    while(t++<W.turns){const a=ACTIONS[W.acts[Math.floor(Math.random()*W.acts.length)]];
     const r=a.run(s0,W);applyFx2(s0,r.fx);
     if(Math.random()<0.45&&W.evs.length){const ev=W.evs[Math.floor(Math.random()*W.evs.length)];
      if(ev.fx)applyFx2(s0,ev.fx);
      if(ev.ch)applyFx2(s0,ev.ch[Math.floor(Math.random()*ev.ch.length)].fx);}}
    node=sc.next;continue;}
   if(sc.choices){const ok=sc.choices.filter(c=>reqOk(c));const pick=ok[Math.floor(Math.random()*ok.length)]||sc.choices[0];
    applyFx2(s0,pick.fx);if(pick.set)Object.assign(s0.set,pick.set);node=pick.route?pick.route(s0):pick.next;continue;}
   let nx=sc.next;if(typeof nx==="function")nx=nx(s0);node=nx;}}catch(e){errs.push("异常:"+e.message+" @"+node)}
 }
 return JSON.stringify({errs:errs.slice(0,20),errCount:errs.length,endingsReached:ends,runs:n});
};
function applyFx2(s,fx){if(!fx)return;for(const k in fx){const v=fx[k];if(!v)continue;
 if(k.slice(0,3)==="aff"){const id=k.slice(3).toLowerCase();if(s.aff[id]!==undefined)s.aff[id]=clamp(s.aff[id]+v);continue;}
 if(k==="money")s.money=Math.max(0,s.money+v);else s[k]=clamp(s[k]+v);}}

 /* --- 底栏：显隐 + 液态玻璃滑动切换（iOS Tab Bar 交互） --- */
 (function(){
   var hud=document.getElementById("hud"),nav=document.getElementById("nav");
   if(!hud||!nav)return;

   var goo=nav.querySelector(".navGoo");
   var btns=[].slice.call(nav.querySelectorAll(".navbtn"));
   var scrim=document.getElementById("navScrim");
   if(!goo||!btns.length)return;
   var idx=0,sliding=false,hotIdx=-1;

   // animate=false 用独立的 noanim 类瞬时定位；**不能**借用 sliding，
   // 否则会把「正在滑动」这个交互态一起摘掉（踩过）。
   function place(i,animate){
     var b=btns[i];if(!b)return;
     var g=goo.getBoundingClientRect(),r=b.getBoundingClientRect();
     if(r.width<=0)return;                       // 底栏还没显示出来，量不到尺寸
     if(!animate)nav.classList.add("noanim");
     nav.style.setProperty("--nav-lens-x",Math.round(r.left-g.left)+"px");
     nav.style.setProperty("--nav-lens-w",Math.round(r.width)+"px");
     if(!animate){void nav.offsetWidth;nav.classList.remove("noanim");}
   }
   function setActive(i,animate){
     if(i<0||i>=btns.length)i=0;
     idx=i;
     btns.forEach(function(b,j){b.classList.toggle("active",j===i);});
     place(i,animate);
   }
   function hotAt(x){
     for(var i=0;i<btns.length;i++){
       var r=btns[i].getBoundingClientRect();
       if(x>=r.left-2&&x<=r.right+2)return i;
     }
     return -1;
   }
   function markHot(i){
     if(i<0)i=hotIdx<0?idx:hotIdx;      // 手指滑出底栏时保持在上一个有效项
     if(i===hotIdx)return;
     hotIdx=i;
     btns.forEach(function(b,j){b.classList.toggle("hot",j===i);});
     place(i,false);
   }
   function fire(i){
     var k=btns[i]&&btns[i].dataset.nav;
     /* 局内点「状态 / 谋略」打开对应面板；不在局中则明确回绝，
        不再像 v2.6 那样因为 window.st 恒为 undefined 而静默无反应。 */
     if(k==="aff"){if(window.st)openPanel("aff");else if(window.toast)toast("开局后才能看人物状态");}
     else if(k==="cards"){if(window.st)openPanel("cards");else if(window.toast)toast("开局后才能看谋略");}
     else if(k==="gal"){showGallery("end");}
   }
   function clearHot(){hotIdx=-1;btns.forEach(function(b){b.classList.remove("hot");});}

   nav.addEventListener("pointerdown",function(e){
     if(!nav.classList.contains("on"))return;
     sliding=true;hotIdx=-1;
     if(scrim)scrim.classList.add("on");
     try{nav.setPointerCapture(e.pointerId);}catch(_){}
     markHot(hotAt(e.clientX));
     nav.classList.add("sliding");            // 放在 markHot 之后，避免被 place 影响
     buzz(6);
     if(e.cancelable)e.preventDefault();
   });
   nav.addEventListener("pointermove",function(e){
     if(!sliding)return;
     markHot(hotAt(e.clientX));
     if(e.cancelable)e.preventDefault();
   });
   function endSlide(e){
     if(!sliding)return;
     sliding=false;
     nav.classList.remove("sliding");
     if(scrim)scrim.classList.remove("on");
     var i=hotAt(e.clientX);if(i<0)i=hotIdx<0?idx:hotIdx;
     clearHot();
     setActive(i,true);
     fire(i);
     buzz(8);
     // 吞掉随之而来的原生 click，避免重复触发
     setTimeout(function(){},0);
   }
   nav.addEventListener("pointerup",endSlide);
   nav.addEventListener("pointercancel",function(){
     if(!sliding)return;
     sliding=false;nav.classList.remove("sliding");
     if(scrim)scrim.classList.remove("on");
     clearHot();setActive(idx,true);
   });
   // 交互全部走 pointer 事件（点按 = 原地按下抬起），原生 click 一律拦掉
   nav.addEventListener("click",function(e){
     e.preventDefault();e.stopPropagation();
   },true);

   window.__navSet=function(i,animate){setActive(i,animate);};
   window.__navReset=function(){setActive(0,false);};
   window.__navRelayout=function(){place(idx,false);};

   // 底栏显隐跟随 HUD；每次由隐藏变可见都要重新量一次尺寸再定位
   // （游戏启动时还停在标题页，那时底栏 display:none，量到的宽度是 0）
   function sync(){
     var on=!!(hud.style.display&&hud.style.display!=="none");
     var was=nav.classList.contains("on");
     nav.classList.toggle("on",on);
     if(on&&!was)setTimeout(function(){place(idx,false);},0);
   }
   sync();
   try{new MutationObserver(sync).observe(hud,{attributes:true,attributeFilter:["style"]});}catch(e){}
   // 字体/图标加载完尺寸还会变一次，兜底再量一遍
   setTimeout(function(){place(idx,false);},600);
   setTimeout(function(){place(idx,false);},1800);
   addEventListener("resize",function(){place(idx,false);});
   addEventListener("orientationchange",function(){setTimeout(function(){place(idx,false);},280);});
 })();

 /* --- 玻璃反光斑跟随指针（液态玻璃的镜面高光） --- */
 (function(){
   var SEL="#dlg,#nav,.choice,.waveCard,.panelCard,#endCard,.chip,.gslot,.ach,.wAct,.tabs button";
   var cur=null;
   function put(e,x,y){
     var r=e.getBoundingClientRect();
     e.style.setProperty("--mx",(x-r.left)+"px");
     e.style.setProperty("--my",(y-r.top)+"px");
   }
   document.addEventListener("pointermove",function(ev){

     if(t){cur=t;put(t,ev.clientX,ev.clientY);}
   },{passive:true});
 })();

 /* --- 返回键：先关界面，再退出 --- */
 window.__onBack=function(){
   function close(id){var e=document.getElementById(id);if(e){e.classList.remove("show");return true;}return false;}
   function shown(id){var e=document.getElementById(id);return !!(e&&e.classList.contains("show"));}
   if(shown("gallery")){
     if(window.closeGallery)window.closeGallery();else close("gallery");
     return true;
   }
   if(shown("panel")){close("panel");if(window.__navReset)window.__navReset();return true;}
   if(shown("ending")){
     close("ending");
     window.st=null;                        // 结局后回标题＝真正回到开局状态，别留半个存档态
     document.getElementById("title").classList.add("show");
     if(window.__navReset)window.__navReset();
     return true;
   }
   // 风浪回合 / 时代过场是强流程，返回不关也不退出
   if(shown("wave")){if(window.toast)toast("风浪回合要先做完");return true;}
   if(shown("era")){if(window.toast)toast("看完这一段再走");return true;}
   // 其余情况：两秒内再按一次才退出，避免误触直接掉出游戏
   var now=Date.now();
   if(window.__lastBack&&now-window.__lastBack<2000)return false;
   window.__lastBack=now;
   if(window.toast)toast("再按一次退出");
   return true;
 };

 /* --- Apple 式长按拖拽选择（全平台） --- */
 (function(){
  var box=document.getElementById("choices");if(!box)return;
  var HOLD=P.holdMs||170;
  var timer=null,dragOn=false,cur=null,swallow=false,hintEl=null,hinted=false;
  var lens=document.getElementById("dragLens");
  function lensTo(x,y){if(!lens)return;
    lens.style.setProperty("--lx",x+"px");lens.style.setProperty("--ly",y+"px");}
  function lensOn(on){if(lens)lens.classList.toggle("on",!!on);}
  function at(x,y){var el=document.elementFromPoint(x,y);return (el&&el.closest)?el.closest(".choice"):null;}
  function hl(el){
   if(el&&el.classList.contains("lock"))el=null;
   if(cur===el)return;
   if(cur)cur.classList.remove("dragOver");
   cur=el;
   if(cur)cur.classList.add("dragOver");
  }
  function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
  function showHint(){
   if(hinted||!box.parentNode)return;hinted=true;
   hintEl=document.createElement("div");
   hintEl.className="dragHint";
   hintEl.textContent="长按选项可拖动选择";
   box.parentNode.insertBefore(hintEl,box);
   setTimeout(function(){if(hintEl){hintEl.classList.add("fade");setTimeout(function(){if(hintEl&&hintEl.parentNode)hintEl.parentNode.removeChild(hintEl);hintEl=null;},600);}},2600);
  }
  box.addEventListener("pointerdown",function(e){
   var c=e.target&&e.target.closest?e.target.closest(".choice"):null;if(!c)return;
   if(timer)clearTimeout(timer);
   timer=setTimeout(function(){
    timer=null;dragOn=true;
    document.body.classList.add("dragging");
    c.classList.add("dragging");
    hl(c);showHint();buzz(14);
    if(lens)lensTo(e.clientX,e.clientY);
    lensOn(true);
   },HOLD);
  },{passive:true});
  document.addEventListener("pointermove",function(e){
   if(!dragOn){if(timer&&Math.abs(e.movementY||0)>6){clearTimeout(timer);timer=null;}return;}
   if(e.cancelable)e.preventDefault();
   lensTo(e.clientX,e.clientY);
   hl(at(e.clientX,e.clientY));
  },{passive:false});
  function endDrag(){
   if(timer){clearTimeout(timer);timer=null;}
   if(!dragOn)return;
   dragOn=false;lensOn(false);
   document.body.classList.remove("dragging");
   var d=document.querySelector(".choice.dragging");if(d)d.classList.remove("dragging");
   var t=cur;hl(null);
   if(t&&!t.classList.contains("lock")){
    var fn=t.onclick;
    swallow=true;setTimeout(function(){swallow=false;},420);
    t.classList.add("chosen");
    buzz(8);
    setTimeout(function(){if(fn)try{fn.call(t);}catch(e){}},80);
   }
  }
  document.addEventListener("pointerup",endDrag);
  document.addEventListener("pointercancel",function(){
   if(timer){clearTimeout(timer);timer=null;}
   dragOn=false;lensOn(false);
   document.body.classList.remove("dragging");
   var d=document.querySelector(".choice.dragging");if(d)d.classList.remove("dragging");
   hl(null);
  });
  box.addEventListener("click",function(e){if(swallow){e.preventDefault();e.stopPropagation();}},true);
 })();

 /* --- PWA：注册 Service Worker 实现离线可玩（仅 http/https，file:// 下跳过） --- */
 if(P.sw&&!P.app){
  try{
   if("serviceWorker" in navigator&&location.protocol!=="file:"){
    addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
   }
  }catch(e){}
 }
})();
